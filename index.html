<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PublrEditor — dev</title>
    <!-- All styling is Tailwind: utilities inline on the chrome markup (now
     library-owned — src/shell.html, injected by createEditorShell);
     src/styles.css (imported by demo.ts) adds only the canvas-owned layer for
     markup the editor generates at runtime. -->
  </head>
  <body>
    <!-- The page is a HOST: the entire harness (topbar, rails, sidebar,
     patterns explorer — one PublrJS island) is library markup injected here
     by createEditorShell(). src/demo.ts supplies what any host would: blocks,
     theme, CSS engine, and the content below. -->
    <div id="shell-mount" class="h-screen"></div>

    <!-- Seed content: plain annotated HTML in this page — the editor's only input
     language. The blockquote has no data-pb-block: it must survive as an
     opaque raw-html passthrough. -->
    <template id="seed">
      <h1 data-pb-block="heading" data-pb-tag="level" data-pb-rich="text">Hello, PublrEditor</h1>
      <p data-pb-block="paragraph" data-pb-rich="body">
        A fresh start. This paragraph carries <em>rich</em> inline content and syncs to the model as
        you type.
      </p>
      <p data-pb-block="paragraph" data-pb-rich="body">
        Press Enter to split a block. Backspace an empty block away.
      </p>
      <div data-pb-block="group" data-pb-children>
        <h3 data-pb-block="heading" data-pb-tag="level" data-pb-rich="text">A grouped section</h3>
        <p data-pb-block="paragraph" data-pb-rich="body">
          These two blocks live inside a Group. Select several top-level blocks and press ⌘G to make
          one; ⇧⌘G (or the toolbar) dissolves it.
        </p>
      </div>
      <blockquote>
        Markup without data-pb-* annotations loads as an opaque raw-html block — permissive upcast,
        nothing errors.
      </blockquote>
    </template>

    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
